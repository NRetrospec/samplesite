<style>
  .middle {
    text-align: center; /* Center all inline elements within the section */
    position: relative; /* Establish a positioning context for absolute positioning */
  }
  #spaceBarButton {
    position: absolute; /* Absolutely position the button */
    bottom: 20px;  /* Adjust this value to move the button up or down */
    left: 50%; /* Center the button horizontally */
    transform: translateX(-50%); /* Adjust for width of the button */
    z-index: 1; /* Ensure it is over the game */
  }
</style>

<section class="middle">
  <header id="middlesetup">
    <h1 class="gametitle">Icy Tower</h1>
  </header>
  <script id="game" src="https://xxsibxx.github.io/ruffleembedsetup112/ruffle/ruffle.js"></script>
  <div id="gameContainer">
    <embed id="gameEmbed" class="game-embed" height="100%" pluginspage="http://www.macromedia.com/go/getflashplayer" src="https://phreshhhhh.github.io/icytower/icy_tower.swf" type="application/x-shockwave-flash" width="100%"></embed>
  </div>
  <button id="spaceBarButton">Press Space</button>
  <script>
    document.getElementById('spaceBarButton').addEventListener('click', function () {
        // Focus on the embed to ensure it can receive events
        document.getElementById('gameEmbed').focus();

        // Create and dispatch keydown event
        const spaceEvent = new KeyboardEvent('keydown', { key: ' ', bubbles: true });
        document.getElementById('gameEmbed').dispatchEvent(spaceEvent);
    });
  </script>
</section>
